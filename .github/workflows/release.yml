name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Xbox 360 output (optional)
        timeout-minutes: 3
        run: pip install --disable-pip-version-check --no-input --retries 1 --timeout 15 -r requirements-xbox.txt
        continue-on-error: true
      - name: Tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Check the tag matches the version in the code
        shell: pwsh
        run: |
          $v = (Select-String -Path txbridge\__init__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match __version__ $v" }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: pyinstaller --noconfirm --clean packaging/TxBridge.spec
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\TxBridge\data | Out-Null
          Compress-Archive -Path dist\TxBridge -DestinationPath "dist\TxBridge-$env:VERSION-portable.zip"
          Remove-Item -Recurse -Force dist\TxBridge\data
      - name: Installer
        timeout-minutes: 10
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/TxBridge-Setup-*.exe
            dist/TxBridge-*-portable.zip

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System libraries for Qt and AppImage
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-3 libegl1 libfontconfig1 libfuse2 libgl1 libglib2.0-0 libx11-6 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxcb1 libxkbcommon0 libxkbcommon-x11-0
      - run: pip install -r requirements-dev.txt evdev
      - name: Tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Check the tag matches the version in the code
        run: |
          VERSION=$(python -c "from txbridge import __version__; print(__version__)")
          test "v$VERSION" = "$GITHUB_REF_NAME"
      - run: pyinstaller --noconfirm --clean packaging/TxBridge.spec
      - name: Build and smoke-test Linux packages
        run: |
          VERSION=$(python -c "from txbridge import __version__; print(__version__)")
          bash packaging/build_linux.sh "$VERSION"
          QT_QPA_PLATFORM=offscreen TXBRIDGE_AUTOQUIT_MS=3000 \
            "dist/TxBridge-$VERSION-x86_64.AppImage" --appimage-extract-and-run --demo
          dpkg-deb --info "dist/txbridge_${VERSION}_amd64.deb"
          sudo apt-get install -y "./dist/txbridge_${VERSION}_amd64.deb"
          QT_QPA_PLATFORM=offscreen TXBRIDGE_AUTOQUIT_MS=3000 txbridge --demo
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/TxBridge-*.AppImage
            dist/txbridge_*_amd64.deb

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
