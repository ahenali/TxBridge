name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  windows-build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Xbox 360 output (optional)
        timeout-minutes: 3
        run: pip install --disable-pip-version-check --no-input --retries 1 --timeout 15 -r requirements-xbox.txt
        continue-on-error: true
      - run: pyinstaller --noconfirm --clean packaging/TxBridge.spec
      - name: Start the built program and let it quit by itself
        shell: pwsh
        env:
          TXBRIDGE_AUTOQUIT_MS: "3000"
          TXBRIDGE_DATA: ${{ runner.temp }}\txbridge-smoke
        run: |
          $p = Start-Process dist\TxBridge\TxBridge.exe -ArgumentList "--demo" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "TxBridge.exe exited with code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: TxBridge-windows-folder
          path: dist/TxBridge
