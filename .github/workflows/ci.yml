name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  windows-build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Xbox 360 output (optional)
        timeout-minutes: 3
        run: pip install --disable-pip-version-check --no-input --retries 1 --timeout 15 -r requirements-xbox.txt
        continue-on-error: true
      - run: pyinstaller --noconfirm --clean packaging/TxBridge.spec
      - name: Start the built program and let it quit by itself
        shell: pwsh
        env:
          TXBRIDGE_AUTOQUIT_MS: "3000"
          TXBRIDGE_DATA: ${{ runner.temp }}\txbridge-smoke
        run: |
          $p = Start-Process dist\TxBridge\TxBridge.exe -ArgumentList "--demo" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "TxBridge.exe exited with code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: TxBridge-windows-folder
          path: dist/TxBridge

  linux-build:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System libraries for Qt and AppImage
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-3 libegl1 libfontconfig1 libfuse2 libgl1 libglib2.0-0 libx11-6 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxcb1 libxkbcommon0 libxkbcommon-x11-0
      - run: pip install -r requirements-dev.txt evdev
      - run: pyinstaller --noconfirm --clean packaging/TxBridge.spec
      - name: Build Linux packages
        run: |
          VERSION=$(python -c "from txbridge import __version__; print(__version__)")
          bash packaging/build_linux.sh "$VERSION"
      - name: Smoke-test AppImage and inspect Debian package
        run: |
          VERSION=$(python -c "from txbridge import __version__; print(__version__)")
          QT_QPA_PLATFORM=offscreen TXBRIDGE_AUTOQUIT_MS=3000 \
            "dist/TxBridge-$VERSION-x86_64.AppImage" --appimage-extract-and-run --demo
          dpkg-deb --info "dist/txbridge_${VERSION}_amd64.deb"
          sudo apt-get install -y "./dist/txbridge_${VERSION}_amd64.deb"
          QT_QPA_PLATFORM=offscreen TXBRIDGE_AUTOQUIT_MS=3000 txbridge --demo
      - uses: actions/upload-artifact@v4
        with:
          name: TxBridge-linux-packages
          path: |
            dist/TxBridge-*.AppImage
            dist/txbridge_*_amd64.deb
